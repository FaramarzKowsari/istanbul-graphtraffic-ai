seed: 2026
data:
  path: data/processed/traffic.csv
  graph_path: data/processed/graph.npz
  history: 24
  horizons: [1, 2, 3, 6]
  target: avg_speed
  features: [avg_speed, vehicle_count, traffic_density, hour_sin, hour_cos, dow_sin, dow_cos]
  train_fraction: 0.70
  val_fraction: 0.15
model:
  name: dynamic_graph_transformer
  hidden_dim: 96
  heads: 4
  dropout: 0.15
  quantiles: [0.05, 0.5, 0.95]
training:
  epochs: 80
  batch_size: 32
  lr: 0.0005
  weight_decay: 0.0001
  patience: 10
output:
  dir: artifacts/research
