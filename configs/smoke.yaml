seed: 42
data:
  path: data/processed/traffic.csv
  graph_path: data/processed/graph.npz
  history: 12
  horizons: [1, 2, 3]
  target: avg_speed
  features: [avg_speed, vehicle_count, traffic_density, hour_sin, hour_cos, dow_sin, dow_cos]
  train_fraction: 0.70
  val_fraction: 0.15
model:
  name: dynamic_graph_transformer
  hidden_dim: 32
  heads: 4
  dropout: 0.10
  quantiles: [0.1, 0.5, 0.9]
training:
  epochs: 3
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0001
  patience: 3
output:
  dir: artifacts/smoke
