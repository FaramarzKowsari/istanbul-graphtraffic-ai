[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "istanbul-graphtraffic-ai"
version = "0.1.0"
description = "Uncertainty-aware spatiotemporal graph learning for Istanbul traffic forecasting"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Faramarz Kowsari"}]
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "torch>=2.1",
  "scikit-learn>=1.3",
  "PyYAML>=6.0",
  "networkx>=3.1",
  "matplotlib>=3.7"
]

[project.urls]
Homepage = "https://faramarzkowsari.github.io"
Repository = "https://github.com/FaramarzKowsari/istanbul-graphtraffic-ai"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
