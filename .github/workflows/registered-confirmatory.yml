name: Registered IBB Confirmatory Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confirmatory:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout frozen protocol
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Unit tests
        run: pytest -q

      - name: Verify OSF registration metadata is frozen
        run: |
          python - <<'PY'
          import yaml
          p=yaml.safe_load(open("configs/confirmatory_plan.yaml", encoding="utf-8"))
          s=p["study"]
          for k in ("osf_registration_doi","osf_registration_url","registration_timestamp_utc"):
              v=str(s.get(k,""))
              assert v and "TO_BE_FILLED" not in v, f"{k} must be filled after OSF registration"
          print("OSF registration metadata present:", s["osf_registration_doi"])
          PY

      - name: Run single registered confirmatory benchmark
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/run_confirmatory_multimonth.py \
            --plan configs/confirmatory_plan.yaml

      - name: Show registered result
        if: always()
        run: |
          if [ -f reports/confirmatory/CONFIRMATORY_RESULTS.md ]; then
            cat reports/confirmatory/CONFIRMATORY_RESULTS.md
          fi

      - name: Upload confirmatory archive
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: registered-ibb-confirmatory
          if-no-files-found: warn
          retention-days: 90
          path: |
            reports/confirmatory/**
            configs/confirmatory_plan.yaml
            configs/confirmatory_generated/**
            artifacts/confirmatory/*/*/*/metrics.json
            artifacts/confirmatory/*/*/*/training_history.json
