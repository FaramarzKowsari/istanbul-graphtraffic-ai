name: Real IBB Pilot Benchmark

on:
  workflow_dispatch:
    inputs:
      period:
        description: "IBB monthly resource period (YYYY-MM)"
        required: true
        default: "2025-01"
        type: string
      sensors:
        description: "Number of high-coverage geohash nodes"
        required: true
        default: "48"
        type: string
      epochs:
        description: "Maximum epochs for each neural model"
        required: true
        default: "30"
        type: string

permissions:
  contents: read

jobs:
  real-data-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run unit tests
        run: pytest -q

      - name: Run real IBB pilot benchmark
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/run_real_ibb_pilot.py \
            --period "${{ inputs.period }}" \
            --sensors "${{ inputs.sensors }}" \
            --epochs "${{ inputs.epochs }}"

      - name: Show pilot summary
        if: always()
        run: |
          if [ -f reports/pilot/PILOT_SUMMARY.md ]; then
            cat reports/pilot/PILOT_SUMMARY.md
          fi

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibb-real-pilot-${{ inputs.period }}-${{ inputs.sensors }}nodes
          if-no-files-found: warn
          retention-days: 30
          path: |
            reports/pilot/**
            configs/real_pilot_generated/**
            artifacts/real_pilot/*/metrics.json
            artifacts/real_pilot/*/training_history.json
            data/processed/traffic_real_pilot_*.csv
