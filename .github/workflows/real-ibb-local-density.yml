name: Real IBB Local-Density Graph Pilot

on:
  workflow_dispatch:
    inputs:
      period:
        description: "IBB monthly resource period (YYYY-MM)"
        required: true
        default: "2025-01"
        type: string
      sensors:
        description: "Total anchor + local-neighborhood nodes"
        required: true
        default: "64"
        type: string
      cluster_size:
        description: "Nodes per citywide anchor cluster"
        required: true
        default: "4"
        type: string
      min_train_coverage:
        description: "Minimum TRAIN-only hourly coverage"
        required: true
        default: "0.98"
        type: string
      epochs:
        description: "Maximum epochs per neural condition"
        required: true
        default: "30"
        type: string

permissions:
  contents: read

jobs:
  local-density-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run unit tests
        run: pytest -q

      - name: Run local-density graph pilot
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/run_real_ibb_local_density_pilot.py \
            --period "${{ inputs.period }}" \
            --sensors "${{ inputs.sensors }}" \
            --cluster-size "${{ inputs.cluster_size }}" \
            --min-train-coverage "${{ inputs.min_train_coverage }}" \
            --epochs "${{ inputs.epochs }}"

      - name: Show Pilot #5 summary
        if: always()
        run: |
          if [ -f reports/pilot/local_density_pilot/graph_comparison/ROAD_GRAPH_SUMMARY.md ]; then
            cat reports/pilot/local_density_pilot/graph_comparison/ROAD_GRAPH_SUMMARY.md
          fi

      - name: Upload Pilot #5 artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ibb-local-density-${{ inputs.period }}-${{ inputs.sensors }}nodes
          if-no-files-found: warn
          retention-days: 30
          path: |
            reports/pilot/local_density_pilot/**
            configs/local_density_generated/**
            artifacts/local_density_pilot/*/metrics.json
            artifacts/local_density_pilot/*/training_history.json
            data/processed/traffic_real_pilot_*_local_density.csv
